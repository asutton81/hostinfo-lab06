
name: Python Build Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile python/hostinfo_server.py

      - name: Install Flake8
        run: python -m pip install flake8
        
      - name: Install Bandit
        run: python -m pip install bandit
        
      - name: Build Docker image
        run: docker build -t hostinfo-lab06:test .


      - name: Scan Python code for security issues
        run: python -m bandit -r python -ll


      - name: Lint Python code
        run: python -m flake8 python/hostinfo_server.py --count --select=E9,F63,F7,F82 --show-source --statistics
